# cloudrun.yaml
# Safe deployment template. Never commit real secrets in this file.
# Replace region and image values for your deployment target.
# Secret values must come from Google Secret Manager via valueFrom.secretKeyRef.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chain-app
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containers:
      - image: chain-app:latest  # Override with --image on deploy
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
        env:
        - name: ENV
          value: "production"
        - name: FLASK_ENV
          value: "production"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: chain-secret-key
              key: latest
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chain-database-url
              key: latest
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: chain-redis-url
              key: latest
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: chain-supabase-url
              key: latest
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: chain-supabase-anon-key
              key: latest
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: chain-supabase-service-role-key
              key: latest
        - name: APP_BASE_URL
          valueFrom:
            secretKeyRef:
              name: chain-app-base-url
              key: latest
        - name: LIVEKIT_URL
          valueFrom:
            secretKeyRef:
              name: chain-livekit-url
              key: latest
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: chain-livekit-api-key
              key: latest
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: chain-livekit-api-secret
              key: latest
        - name: TURN_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: chain-turn-server-url
              key: latest
        - name: TURN_USERNAME
          valueFrom:
            secretKeyRef:
              name: chain-turn-username
              key: latest
        - name: TURN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chain-turn-password
              key: latest
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: chain-sentry-dsn
              key: latest
        ports:
        - containerPort: 8080
      containerConcurrency: 80
      timeoutSeconds: 300
