<div id="call-overlay-incoming" class="call-overlay" style="display:none">
  <div class="call-incoming-info">
    <div style="width:80px;height:80px;border-radius:50%;background:#374151;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#9ca3af">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    </div>
    <h2 data-caller-name>Incoming Call</h2>
    <p data-call-type>Audio Call</p>
  </div>
  <div class="call-incoming-actions">
    <button data-call-reject class="call-control-btn danger" data-call-id="" style="width:64px;height:64px;font-size:24px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    </button>
    <button data-call-accept class="call-control-btn success" data-call-id="" data-caller-id="" data-call-type="audio" style="width:64px;height:64px;font-size:24px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    </button>
  </div>
</div>

<div id="call-overlay-outgoing" class="call-overlay" style="display:none">
  <div class="call-info">
    <div style="width:80px;height:80px;border-radius:50%;background:#374151;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#9ca3af">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    </div>
    <h2>Calling...</h2>
    <p id="call-timer" class="call-timer" style="display:none"></p>
  </div>
  <div class="call-controls">
    <button data-call-cancel class="call-control-btn danger" style="width:64px;height:64px;font-size:24px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    </button>
  </div>
</div>

<div id="call-overlay-connected" class="call-overlay" style="display:none">
  <div class="call-video-container">
    <video id="call-remote-video" autoplay playsinline></video>
    <audio id="call-remote-audio" autoplay></audio>
    <div class="call-local-video">
      <video id="call-local-video" autoplay playsinline muted></video>
    </div>
  </div>
  <div class="call-info" style="position:absolute;top:calc(16px + var(--call-safe-top));left:0;right:0;z-index:2">
    <p id="call-timer-connected" class="call-timer">00:00</p>
    <p id="call-remote-mute" hidden style="color:#ef4444;font-size:13px;margin:4px 0 0">Remote mic muted</p>
    <p id="call-remote-camera" hidden style="color:#ef4444;font-size:13px;margin:4px 0 0">Remote camera off</p>
  </div>
  <div class="call-controls">
    <button id="call-mute-btn" class="call-control-btn" data-muted="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button data-call-end class="call-control-btn danger">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
    </button>
    <button id="call-speaker-btn" class="call-control-btn" data-speaker-enabled="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
    </button>
    <button id="call-camera-btn" class="call-control-btn" data-camera-enabled="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    </button>
    <button id="pip-btn" class="call-control-btn" data-pip-btn data-minimize-call aria-label="Picture in picture">
      PiP
    </button>
    <button id="call-switch-camera-btn" class="call-control-btn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
    </button>
  </div>
</div>

<div id="call-overlay-reconnecting" class="call-overlay" style="display:none">
  <div class="call-reconnecting-text">
    <div style="width:48px;height:48px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;margin:0 auto 16px;animation:call-spin 0.8s linear infinite"></div>
    <p>Reconnecting call...</p>
    <p style="font-size:13px;color:var(--call-text-secondary);margin-top:4px">Please wait</p>
  </div>
</div>

<div id="call-ringtone-unlock" class="call-ringtone-unlock" hidden>
  <span>Tap to enable call sound</span>
  <button id="call-ringtone-unlock-btn">Enable Sound</button>
</div>

<style>
@keyframes call-spin {
  to { transform: rotate(360deg); }
}
</style>
