<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Not Found | NamVibe</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1d2547 0, #0a0f1f 55%, #050814 100%);
      color: #f4f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(560px, calc(100vw - 32px));
      padding: 32px;
      border-radius: 24px;
      background: rgba(10, 15, 31, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { margin: 0 0 20px; line-height: 1.6; color: rgba(244, 247, 251, 0.82); }
    a {
      display: inline-block;
      margin: 6px 8px 0;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }
    .primary { background: linear-gradient(135deg, #ff4d8d, #7c5cff); color: white; }
    .secondary { background: rgba(255, 255, 255, 0.08); color: #f4f7fb; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>@{{ username }} not found</h1>
    <p>The profile you were looking for does not exist or is unavailable right now.</p>
    <div>
      <a class="primary" href="/">Return Home</a>
      <a class="secondary" href="/discover/">Discover People</a>
    </div>
  </main>
</body>
</html>
