{% extends "base.html" %}
{% block title %}Share | {{ APP_NAME }}{% endblock %}
{% block content %}
<div style="max-width:600px;margin:0 auto;padding:20px">
  <div style="background:rgba(255,255,255,.94);border:1px solid rgba(15,23,42,.08);border-radius:28px;padding:24px">
    <h2 style="margin:0 0 20px;color:#0f172a">Share</h2>
    {% if share_data %}
    <div style="display:flex;gap:16px;padding:16px;background:#f8fafc;border-radius:16px;margin-bottom:20px">
      {% if share_data.image %}
      <img src="{{ share_data.image }}" alt="" style="width:64px;height:64px;border-radius:12px;object-fit:cover">
      {% endif %}
      <div>
        <strong style="color:#0f172a;font-size:16px">{{ share_data.title }}</strong>
        <p style="color:#64748b;font-size:14px;margin:4px 0 0">{{ share_data.description[:100] }}</p>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <button onclick="shareVia('whatsapp')" style="padding:14px;border-radius:14px;border:none;background:#25D366;color:#fff;font-weight:700;cursor:pointer;font-size:15px"><i class="fab fa-whatsapp"></i> WhatsApp</button>
      <button onclick="shareVia('facebook')" style="padding:14px;border-radius:14px;border:none;background:#1877F2;color:#fff;font-weight:700;cursor:pointer;font-size:15px"><i class="fab fa-facebook"></i> Facebook</button>
      <button onclick="shareVia('email')" style="padding:14px;border-radius:14px;border:none;background:#6b7280;color:#fff;font-weight:700;cursor:pointer;font-size:15px"><i class="fas fa-envelope"></i> Email</button>
      <button onclick="copyLink()" style="padding:14px;border-radius:14px;border:none;background:#111827;color:#fff;font-weight:700;cursor:pointer;font-size:15px"><i class="fas fa-link"></i> Copy Link</button>
    </div>
    <div id="share-result" style="margin-top:16px;font-size:14px;text-align:center;color:#64748b"></div>
    {% else %}
    <p style="color:#64748b">Nothing to share.</p>
    {% endif %}
  </div>
</div>
<script>
function shareVia(platform) {
  const url = "{{ share_data.url }}";
  const text = encodeURIComponent("{{ share_data.title }}");
  let shareUrl = "";
  if (platform === "whatsapp") shareUrl = `https://wa.me/?text=${text}%20${encodeURIComponent(url)}`;
  else if (platform === "facebook") shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
  else if (platform === "email") shareUrl = `mailto:?subject=${text}&body=${encodeURIComponent(url)}`;
  if (navigator.share && platform === "whatsapp") {
    navigator.share({title: "{{ share_data.title }}", url: url}).catch(()=>{});
    return;
  }
  if (shareUrl) window.open(shareUrl, "_blank", "width=600,height=400");
}
function copyLink() {
  const url = "{{ share_data.url }}";
  navigator.clipboard.writeText(url).then(() => {
    document.getElementById("share-result").textContent = "Link copied!";
  }).catch(() => {
    document.getElementById("share-result").textContent = "Failed to copy. URL: " + url;
  });
}
</script>
{% endblock %}
