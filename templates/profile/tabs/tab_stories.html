<div class="tab-inline-panel">
  <div class="tab-inline-header">
    <h3><i class="fas fa-circle-play"></i> Your Stories</h3>
    <a href="/stories/" class="filter-chip">View all <i class="fas fa-arrow-right"></i></a>
  </div>
  {% if stories %}
  <div class="tab-inline-grid" style="display:flex; gap:12px; overflow-x:auto; padding:4px 0;">
    {% for s in stories[:6] %}
    <a href="/stories/{{ s.id }}" class="tab-story-card" style="flex-shrink:0; width:100px; text-align:center; text-decoration:none; color:var(--profile-ink);">
      <div class="tab-story-ring" style="width:72px; height:72px; border-radius:50%; margin:0 auto 6px; background:var(--profile-gradient); padding:3px;">
        <div style="width:100%; height:100%; border-radius:50%; overflow:hidden; background:var(--profile-surface);">
          {% if s.avatar_url %}
          <img src="{{ s.avatar_url }}" alt="" style="width:100%; height:100%; object-fit:cover;">
          {% else %}
          <div style="width:100%; height:100%; display:grid; place-items:center; font-weight:900; color:var(--profile-ink);">{{ (s.username or 'S')[0]|upper }}</div>
          {% endif %}
        </div>
      </div>
      <span style="font-size:11px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;">{{ s.username or 'Story' }}</span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="manager-empty">
    <i class="fas fa-circle-play"></i>
    <p>No stories yet</p>
    <a href="/status/create"><i class="fas fa-plus"></i> Create Story</a>
  </div>
  {% endif %}
</div>
