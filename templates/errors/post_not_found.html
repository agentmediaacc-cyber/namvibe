<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post not found — NamVibe</title>
  <style>
    *,::after,::before{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0a0a0f;color:#f0f0f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .nv-err{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
    .nv-err-icon{width:64px;height:64px;border-radius:50%;background:rgba(239,68,68,.15);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:#ef4444}
    .nv-err-icon svg{width:32px;height:32px}
    .nv-err-title{font-size:24px;font-weight:700;margin-bottom:8px}
    .nv-err-msg{font-size:15px;color:#9496a8;max-width:400px;line-height:1.6;margin-bottom:24px}
    .nv-err-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
    .nv-err-btn{padding:10px 24px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;transition:all .2s}
    .nv-err-btn-primary{background:#7c3aed;color:#fff}
    .nv-err-btn-primary:hover{background:#6d28d9}
    .nv-err-btn-secondary{background:rgba(255,255,255,.08);color:#f0f0f5}
    .nv-err-btn-secondary:hover{background:rgba(255,255,255,.14)}
  </style>
</head>
<body>
  <div class="nv-err">
    <div class="nv-err-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </div>
    <h1 class="nv-err-title">Post not available</h1>
    <p class="nv-err-msg">{{ message }}</p>
    <div class="nv-err-actions">
      <a href="/" class="nv-err-btn nv-err-btn-primary">Back to Home</a>
      <a href="/discover/" class="nv-err-btn nv-err-btn-secondary">Discover</a>
    </div>
  </div>
</body>
</html>
