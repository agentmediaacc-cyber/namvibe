{% extends "base.html" %}
{% block title %}NamVibe | Feedback{% endblock %}
{% block body_class %}nv-feedback-page{% endblock %}

{% block content %}
<main class="chain-page">
  <section class="chain-panel nv-feedback-panel">
    <h1>Beta Feedback</h1>
    <p class="nv-feedback-subtitle">
      Help us improve NamVibe! Share your feedback about the beta release.
    </p>
    
    <form method="post" action="/api/feedback" id="feedback-form">
      <div class="nv-feedback-form-group">
        <label for="assistant-type" class="nv-feedback-label">
          Feedback Type
        </label>
        <select name="assistant_type" id="assistant-type" required class="nv-feedback-select" title="Select feedback type">
          <option value="">Select type...</option>
          <option value="bug_report">Bug Report</option>
          <option value="feature_request">Feature Request</option>
          <option value="general">General Feedback</option>
          <option value="performance">Performance</option>
          <option value="ui_ux">UI/UX</option>
        </select>
      </div>
      
      <div class="nv-feedback-form-group">
        <label for="rating" class="nv-feedback-label">
          Rating (1-5)
        </label>
        <select name="rating" id="rating" required class="nv-feedback-select" title="Select a rating from 1 to 5">
          <option value="">Select rating...</option>
          <option value="5">5 - Excellent</option>
          <option value="4">4 - Good</option>
          <option value="3">3 - Average</option>
          <option value="2">2 - Poor</option>
          <option value="1">1 - Terrible</option>
        </select>
      </div>
      
      <div class="nv-feedback-form-group">
        <label for="comment" class="nv-feedback-label">
          Your Feedback
        </label>
        <textarea name="comment" id="comment" rows="5" placeholder="Describe your experience, suggest improvements, or report issues..." required class="nv-feedback-textarea"></textarea>
      </div>
      
      <div class="nv-feedback-actions">
        <button type="submit" class="chain-btn primary nv-feedback-btn-flex">
          Send Feedback
        </button>
        <a href="/" class="chain-btn outline nv-feedback-btn-flex">
          Back to Home
        </a>
      </div>
    </form>
  </section>
</main>

<script>
document.getElementById('feedback-form')?.addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const data = Object.fromEntries(formData);
  
  try {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();
    if (result.ok) {
      alert('Thank you for your feedback!');
      this.reset();
      this.innerHTML = '<div class="chain-panel" style="text-align: center; padding: 40px;"><h2>Thank you!</h2><p>Your feedback has been submitted successfully.</p><a href="/" class="chain-btn primary">Back to Home</a></div>';
    } else {
      alert('Failed to submit feedback. Please try again.');
    }
  } catch (err) {
    alert('Network error. Please try again.');
  }
});
</script>
{% endblock %}
