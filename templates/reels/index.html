{% extends "base.html" %}
{% block title %}Reels - NamVibe{% endblock %}
{% block head %}
<link rel="stylesheet" href="/static/css/reels.css?v=phase93">
<style>
.reel-viewport { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
.reel-slide { scroll-snap-align: start; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
.reel-slide video { width: 100%; height: 100%; object-fit: contain; }
.reel-slide.active video { display: block; }
.reel-overlay { position: absolute; inset: 0; background: linear-gradient(transparent 60%, rgba(0,0,0,0.7)); pointer-events: none; }
.reel-info { position: absolute; bottom: 100px; left: 16px; right: 80px; color: #fff; z-index: 2; }
.reel-creator { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.reel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; min-width: 36px; min-height: 36px; }
.reel-username { font-weight: 600; font-size: 14px; }
.reel-caption { font-size: 13px; opacity: 0.9; line-height: 1.3; }
.reel-actions { position: absolute; bottom: 120px; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.reel-action-btn { width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; backdrop-filter: blur(4px); }
.reel-action-btn .reel-count { font-size: 10px; font-weight: 600; }
.reel-mute-btn { position: absolute; top: 60px; right: 12px; width: 44px; height: 44px; min-width: 44px; min-height: 44px; border-radius: 50%; border: none; background: rgba(0,0,0,0.5); color: #fff; font-size: 18px; cursor: pointer; z-index: 3; }
.comment-drawer { position: fixed; bottom: 0; left: 0; right: 0; max-height: 50vh; background: #fff; border-radius: 16px 16px 0 0; z-index: 100; transform: translateY(100%); transition: transform 0.3s; padding: 16px; padding-bottom: env(safe-area-inset-bottom, 0px); }
.comment-drawer.open { transform: translateY(0); }
.comment-drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.drawer-close { width: 44px; height: 44px; min-width: 44px; min-height: 44px; border: none; background: transparent; font-size: 24px; cursor: pointer; }
.comment-list { max-height: 30vh; overflow-y: auto; margin-bottom: 12px; }
.comment-item { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
.comment-form { display: flex; gap: 8px; }
.comment-input { flex: 1; min-height: 44px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.comment-submit { min-width: 44px; min-height: 44px; padding: 8px 16px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
@media (max-width: 480px) {
  .reel-info { bottom: 80px; left: 12px; right: 64px; }
  .reel-actions { bottom: 100px; right: 8px; }
  .reel-action-btn { width: 40px; height: 40px; font-size: 16px; }
}
</style>
{% endblock %}
{% block content %}
<div class="reel-viewport" id="reels-viewport"></div>

<div class="comment-drawer" id="comment-drawer">
  <div class="comment-drawer-header">
    <span style="font-weight:600">Comments</span>
    <button class="drawer-close">&times;</button>
  </div>
  <div class="comment-list"></div>
  <form class="comment-form" id="comment-form">
    <input class="comment-input" placeholder="Add a comment..." maxlength="500">
    <button class="comment-submit" type="submit">Post</button>
  </form>
</div>

<script src="/static/js/namvibe_reels_pro.js?v=phase93"></script>
{% endblock %}
