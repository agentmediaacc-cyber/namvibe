<div class="nvcc-overlay" id="nvcc-overlay">
  <div class="nvcc-header">
    <h2>Create</h2>
    <button type="button" class="nvcc-close-btn" aria-label="Close">&times;</button>
  </div>
  <div class="nvcc-body">
    <div class="nvcc-camera-preview">
      <video autoplay playsinline muted style="display:none"></video>
      <img alt="" style="display:none">
      <div class="nvcc-timer"></div>
    </div>
    <div class="nvcc-preview-area">
      <div class="nvcc-preview-media"></div>
    </div>
    <div class="nvcc-editor-tools">
      <button type="button" class="nvcc-editor-tool" data-editor-tool="text" title="Text" aria-label="Add text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        <span>Text</span>
      </button>
      <button type="button" class="nvcc-editor-tool" data-editor-tool="font" title="Font Style" aria-label="Change font style">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4v4m13-4h4v4m-9-4h-4v8m0 0h-4v4m8-12v4m0 0h4v4"/></svg>
        <span>Font</span>
      </button>
      <button type="button" class="nvcc-editor-tool" data-editor-tool="bgcolor" title="Background Color" aria-label="Change background color">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
        <span>BG Color</span>
      </button>
      <button type="button" class="nvcc-editor-tool" data-editor-tool="emoji" title="Emoji" aria-label="Add emoji">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <span>Emoji</span>
      </button>
      <button type="button" class="nvcc-editor-tool" data-editor-tool="sticker" title="Stickers" aria-label="Add sticker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-8-8.97V12h8.97z"/><path d="M21 12h-9V3"/></svg>
        <span>Stickers</span>
      </button>
      <button type="button" class="nvcc-editor-tool" data-editor-tool="adjust" title="Brightness/Contrast" aria-label="Adjust brightness and contrast">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v20"/></svg>
        <span>Adjust</span>
      </button>
      <button type="button" class="nvcc-editor-tool" data-editor-tool="music" title="Music" aria-label="Add music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>Music</span>
      </button>
    </div>
    <div class="nvcc-editor-panel"></div>
    <div class="nvcc-canvas-wrap" style="display:none">
      <canvas id="nvcc-editor-canvas"></canvas>
    </div>
    <input type="text" class="nvcc-caption-input" placeholder="Add a caption..." maxlength="2200" autocomplete="off">
    <div class="nvcc-progress">
      <div class="nvcc-progress-fill"></div>
    </div>
  </div>
  <div class="nvcc-controls">
    <button type="button" class="nvcc-file-btn" title="Upload from device" aria-label="Upload from device">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </button>
    <button type="button" class="nvcc-capture-btn" title="Capture" aria-label="Capture photo or video"></button>
    <button type="button" class="nvcc-switch-btn" title="Switch camera" aria-label="Switch camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/><polyline points="15 13 12 10 9 13"/></svg>
    </button>
    <input type="file" id="nvcc-file-input" accept="image/jpeg,image/jpg,image/png,image/webp,video/mp4,video/webm,video/quicktime" style="display:none">
    <button type="button" class="nvcc-preview-btn nvcc-preview-btn-secondary nvcc-retake-btn" style="display:none" aria-label="Retake photo or video">Retake</button>
    <button type="button" class="nvcc-preview-btn nvcc-preview-btn-secondary nvcc-cancel-btn" style="display:none" aria-label="Cancel">Cancel</button>
    <button type="button" class="nvcc-preview-btn nvcc-preview-btn-primary nvcc-confirm-btn" style="display:none" aria-label="Confirm">Confirm</button>
  </div>
</div>
<div class="pd-toast" id="nvcc-toast"></div>
