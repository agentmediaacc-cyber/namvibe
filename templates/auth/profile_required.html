{% extends "base.html" %}

{% block title %}Complete Profile | {{ APP_NAME }}{% endblock %}

{% block content %}
<section class="section-head">
    <p>PROFILE</p>
    <h2>Complete your profile</h2>
</section>

<div class="feature-container" style="max-width: 1000px; margin: auto; padding: 0 24px; text-align: center;">
    <div class="feed-card" style="padding: 60px; border-radius: 40px; background: radial-gradient(circle at top right, rgba(124,58,237,0.1), transparent);">
        <div style="font-size: 80px; margin-bottom: 30px;">👤</div>
        <h3 style="font-size: 32px; margin-bottom: 15px;">Complete your profile</h3>
        <p style="color: #bfc0d5; font-size: 18px; line-height: 1.6; max-width: 500px; margin: 0 auto 40px;">
            Your account is ready. Add profile details when you want people to know more about you.
        </p>
        
        <div style="display: flex; justify-content: center; gap: 15px;">
            <a href="/profile/settings" class="primary" style="padding: 15px 40px;">Edit profile</a>
            <a href="/" class="secondary" style="padding: 15px 40px;">Continue</a>
        </div>
    </div>
</div>
{% endblock %}
